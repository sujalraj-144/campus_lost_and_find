<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="4"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="6" stroke-dasharray="12 12"/>
  <circle cx="256" cy="256" r="120" fill="url(#accentGrad)" filter="url(#glow)" opacity="0.15"/>
  <g transform="translate(256, 256) rotate(45)">
    <polygon points="0,-140 38,0 0,25 -38,0" fill="#38bdf8"/>
    <polygon points="0,140 38,0 0,-25 -38,0" fill="#f43f5e"/>
    <circle cx="0" cy="0" r="22" fill="#070b14" stroke="#ffffff" stroke-width="6"/>
  </g>
  <circle cx="256" cy="70" r="10" fill="#38bdf8"/>
  <circle cx="256" cy="442" r="10" fill="#94a3b8"/>
  <circle cx="70" cy="256" r="10" fill="#94a3b8"/>
  <circle cx="442" cy="256" r="10" fill="#94a3b8"/>
</svg>
